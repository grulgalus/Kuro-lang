[package]
name = "kuro"
version = "0.1.0"
edition = "2021"
authors = [
    "Grydldiček",
    "Jandysanko",
    "Opera AI (most of the work is AI generated)"
]
description = "A programming language that I made for myself."
license = "MIT"
repository = "https://github.com/grulgalus/Kuro-lang"
readme = "README.md"
keywords = ["language", "compiler", "kuro"]
categories = ["compilers", "command-line-utilities"]

[dependencies]

[dev-dependencies]

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
debug = false
codegen-units = 1
